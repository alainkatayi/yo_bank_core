services:
  db_bank:
    image: postgres:16
    container_name: db_bank
    environment:
      POSTGRES_DB: db_bank
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
    ports:
      - "5433:5432"
    volumes:
      - db_bank_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d db_bank"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_bank_data: