spring.application.name=bank-core-service
server.port=9081

# Base de données
spring.datasource.url=jdbc:postgresql://localhost:5433/db_bank
spring.datasource.username=bank
spring.datasource.password=bank

# JPA : Flyway gère le schéma, Hibernate vérifie seulement
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,info

# Jetons des agents, signés par ce service et vérifiés localement.
# Le secret fait plus de 32 octets : il sert de clé HMAC pour HS256.
bank.security.jwt.secret=bank-dev-jwt-secret-change-me-32b
bank.security.jwt.issuer=http://localhost:9081
bank.security.jwt.ttl-seconds=1800
# Les jetons du wallet restent émis par Keycloak jusqu'à l'étape suivante.
bank.security.jwt.keycloak-issuer=http://localhost:8180/realms/bank

# Tentatives hors transaction en cas de conflit de version ou de référence dupliquée
bank.retry.max-attempts=5

# Réponses d'erreur : jamais de message, de trace ni de classe d'exception
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=never