spring.application.name=bank-core-service
server.port=9081

# Base de données
spring.datasource.url=jdbc:postgresql://localhost:5433/db_bank
spring.datasource.username=bank
spring.datasource.password=bank

# JPA : Flyway gère le schéma, Hibernate vérifie seulement
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,info